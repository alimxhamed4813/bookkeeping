[project]
name = "riipen-bookkeeping"
version = "0.1.0"
description = "Turn bank and credit card statement PDFs (including scans) into clean, reconciled transaction rows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
]

[project.scripts]
bookkeeping = "bookkeeping.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookkeeping"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
